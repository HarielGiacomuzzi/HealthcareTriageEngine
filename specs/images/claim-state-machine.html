<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claim lifecycle · State machine</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;
        --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:2rem;font-weight:400;letter-spacing:-.02em;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">State machine · Domain / Claim</p>
  <h1>Claim lifecycle</h1>

  <svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- transitions first -->
    <line x1="32" y1="156" x2="64" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="264" y1="156" x2="312" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="512" y1="156" x2="560" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="156" x2="808" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 908 192 L 908 246 L 164 246 L 164 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="264" y1="336" x2="312" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 352 372 L 352 426 L 164 426 L 164 480" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="412" y1="372" x2="412" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="512" y1="516" x2="560" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="164" y1="552" x2="164" y2="596" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="760" y1="516" x2="792" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- ADR-002 deterministic short-circuit -->
    <path d="M 1008 156 L 1064 156 L 1064 664 L 412 664 L 412 552" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

    <!-- transition labels -->
    <rect x="252" y="100" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="288" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PDF TEXT</text>
    <rect x="500" y="100" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="536" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PRESIDIO</text>
    <rect x="740" y="100" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="784" y="110" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">≥1 POLICY</text>
    <rect x="504" y="228" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="540" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUBLISH</text>
    <rect x="248" y="280" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="288" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM RESULT</text>
    <rect x="216" y="408" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="260" y="418" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONF ≥ THR</text>
    <rect x="416" y="416" width="92" height="12" rx="2" fill="#f5f5f5"/>
    <text x="462" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONF &lt; THR</text>
    <rect x="500" y="496" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="536" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
    <rect x="416" y="648" width="184" height="12" rx="2" fill="#f5f5f5"/>
    <text x="508" y="658" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ADR-002 · VERDICT REJECT</text>

    <!-- start -->
    <circle cx="24" cy="156" r="6" fill="#2d3142"/>

    <!-- row A -->
    <rect x="64" y="120" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="164" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RECEIVED</text>
    <text x="164" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pdf stored</text>

    <rect x="312" y="120" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="412" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EXTRACTED</text>
    <text x="412" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raw text</text>

    <rect x="560" y="120" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="660" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REDACTED</text>
    <text x="660" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phi removed</text>

    <rect x="808" y="120" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="908" y="156" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">POLICIES_ATTACHED</text>
    <text x="908" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy set bound</text>

    <!-- row B -->
    <rect x="64" y="300" width="200" height="72" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="164" y="336" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QUEUED</text>
    <text x="164" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">message published</text>

    <rect x="312" y="300" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="412" y="336" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EVALUATED</text>
    <text x="412" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">llm result stored</text>

    <!-- row C -->
    <rect x="64" y="480" width="200" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="164" y="516" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">APPROVED_AUTO</text>
    <text x="164" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook delivered</text>

    <rect x="312" y="480" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="412" y="516" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REVIEW_PENDING</text>
    <text x="412" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">human queue</text>

    <rect x="560" y="480" width="200" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="660" y="516" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REVIEW_RESOLVED</text>
    <text x="660" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook delivered</text>

    <!-- end dots -->
    <circle cx="164" cy="604" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
    <circle cx="164" cy="604" r="5" fill="#2d3142"/>
    <circle cx="800" cy="516" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
    <circle cx="800" cy="516" r="5" fill="#2d3142"/>

    <!-- legend / notes strip -->
    <line x1="32" y1="692" x2="1088" y2="692" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="712" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TERMINAL FAILURES</text>
    <text x="200" y="712" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">EXTRACTION_FAILED · NO_POLICIES · EVALUATION_FAILED · NOTIFY_FAILED — reachable from any stage</text>
    <text x="32" y="736" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GUARD</text>
    <text x="200" y="736" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">every edge validated by ClaimStatus.can_transition_to(next); anything else raises InvalidTransition</text>
  </svg>
</div>
</body>
</html>
