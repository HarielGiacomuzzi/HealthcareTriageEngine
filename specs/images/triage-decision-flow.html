<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Triage decision logic · Flowchart</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;
        --sans:'Geist',system-ui,sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',ui-monospace,monospace}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
  .frame{max-width:1200px;width:100%}
  .eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
  h1{font-family:var(--serif);font-size:2rem;font-weight:400;letter-spacing:-.02em;margin-bottom:1.5rem}
  svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · Domain / Claim triage</p>
  <h1>Decision logic</h1>

  <svg viewBox="0 0 1120 980" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- arrows first -->
    <line x1="440" y1="88" x2="440" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="440" y1="184" x2="440" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="560" y1="280" x2="800" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="440" y1="328" x2="440" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 576 424 L 704 424 L 704 688" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
    <line x1="440" y1="472" x2="440" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="440" y1="584" x2="440" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="576" y1="688" x2="800" y2="688" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <line x1="440" y1="744" x2="440" y2="792" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- merge dot where the ADR-002 short-circuit rejoins the review path -->
    <circle cx="704" cy="688" r="4" fill="#2d3142"/>

    <!-- arrow labels -->
    <rect x="608" y="256" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="644" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NONE</text>
    <rect x="404" y="340" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="440" y="350" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">≥ 1 POLICY</text>
    <rect x="592" y="392" width="96" height="24" rx="2" fill="#f5f5f5"/>
    <text x="640" y="402" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REJECT</text>
    <text x="640" y="412" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNCERTAIN</text>
    <rect x="404" y="484" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="440" y="494" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASS</text>
    <rect x="604" y="664" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="644" y="674" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">&lt; 0.85</text>
    <rect x="404" y="756" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="440" y="766" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">≥ 0.85</text>

    <!-- start (oval) -->
    <rect x="344" y="40" width="192" height="48" rx="20" fill="#f5f5f5"/>
    <rect x="344" y="40" width="192" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="440" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PDF dropped</text>
    <text x="440" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RECEIVED</text>

    <!-- step: extract + redact -->
    <rect x="320" y="120" width="240" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="120" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extract text · redact PII</text>
    <text x="440" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local CPU · ADR-001 · REDACTED</text>

    <!-- decision: policies -->
    <polygon points="440,232 560,280 440,328 320,280" fill="#f5f5f5"/>
    <polygon points="440,232 560,280 440,328 320,280" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenant policies?</text>
    <text x="440" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UC-03</text>

    <!-- terminal: no policies -->
    <rect x="800" y="256" width="240" height="48" rx="20" fill="#f5f5f5"/>
    <rect x="800" y="256" width="240" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="920" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NO_POLICIES</text>
    <text x="920" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">terminal · HTTP 422</text>

    <!-- decision: deterministic -->
    <polygon points="440,376 576,424 440,472 304,424" fill="#f5f5f5"/>
    <polygon points="440,376 576,424 440,472 304,424" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deterministic verdict?</text>
    <text x="440" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADR-002 · pre-LLM</text>

    <!-- step: llm evaluate -->
    <rect x="320" y="520" width="240" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="520" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="440" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM evaluation</text>
    <text x="440" y="566" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QUEUED → EVALUATED</text>

    <!-- decision: confidence (focal) -->
    <polygon points="440,632 576,688 440,744 304,688" fill="#f5f5f5"/>
    <polygon points="440,632 576,688 440,744 304,688" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="440" y="684" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Confidence ≥ 0.85?</text>
    <text x="440" y="700" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADR-003</text>

    <!-- terminal: human review (focal) -->
    <rect x="800" y="656" width="240" height="64" rx="20" fill="#f5f5f5"/>
    <rect x="800" y="656" width="240" height="64" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="920" y="684" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REVIEW_PENDING</text>
    <text x="920" y="702" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">human resolve → REVIEW_RESOLVED</text>

    <!-- terminal: approved -->
    <rect x="320" y="792" width="240" height="48" rx="20" fill="#f5f5f5"/>
    <rect x="320" y="792" width="240" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <text x="440" y="814" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">APPROVED_AUTO</text>
    <text x="440" y="830" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">webhook delivered</text>

    <!-- legend -->
    <line x1="40" y1="888" x2="1080" y2="888" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="140" y="898" width="24" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="172" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START / TERMINAL</text>
    <rect x="340" y="898" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="372" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STEP</text>
    <polygon points="452,898 468,904 452,910 436,904" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="476" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>
    <circle cx="600" cy="904" r="4" fill="#2d3142"/>
    <text x="612" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MERGE</text>
    <rect x="712" y="898" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="744" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HUMAN-IN-THE-LOOP FAIL-SAFE</text>
    <text x="40" y="944" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace">EXTRACTION_FAILED / EVALUATION_FAILED / NOTIFY_FAILED ARE TERMINAL AT ANY STAGE · SEE SPECS/01-DOMAIN/CLAIM.MD</text>
  </svg>
</div>
</body>
</html>
