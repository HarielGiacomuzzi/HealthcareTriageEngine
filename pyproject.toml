[project]
name = "ecet"
version = "0.1.0"
description = "Enterprise Claims Extraction & Triage Engine"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "typer>=0.15,<1",
    "structlog>=24.4,<26",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.19,<2",
    "aiobotocore>=2.15,<3",
    "pypdf>=4,<5",
    "anyio>=4.4,<5",
]

[project.scripts]
ecet = "ecet.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "import-linter>=2.1,<3",
    "pre-commit>=4,<5",
    "testcontainers[postgres]>=4.15,<5",
    "reportlab>=4.2,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecet"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = ["docs", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not e2e'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "slow: needs docker / testcontainers",
    "e2e: needs the full compose stack",
]

[[tool.mypy.overrides]]
module = ["aiobotocore.*", "botocore.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ecet"]

[tool.coverage.report]
exclude_also = [
    '^\s*\.\.\.$',
    'if TYPE_CHECKING:',
]

[tool.importlinter]
root_package = "ecet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CLEAN layers"
type = "layers"
layers = [
    "ecet.interfaces",
    "ecet.infrastructure",
    "ecet.application",
    "ecet.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay framework-free"
type = "forbidden"
source_modules = ["ecet.domain", "ecet.application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "typer",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "aio_pika",
    "boto3",
    "botocore",
    "httpx",
    "pypdf",
    "openai",
    "presidio_analyzer",
    "presidio_anonymizer",
    "ecet.config",
]
